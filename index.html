<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Робоче місце розробки графіків. V.4.5</title>
  <link rel="stylesheet" href="css/style.css">
  
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>

  <!-- Верхняя панель инструментов -->
  <header class="toolbar">
    <label for="fileInput" class="btn btn-open" title="Відкрити Excel файл(и)">📂 Відкрити</label>
    <input type="file" id="fileInput" accept=".xlsx" multiple style="display: none;">

    <div class="divider"></div>

    <button id="savePrologBtn" class="btn" title="Зберегти для ProCTOlog">💾 Для імпорту в ProCTOlog</button>
    <button id="saveNewsletterBtn" class="btn" title="Зберегти для розсилки">💾 Для розсилки</button>
    <button id="saveTrafficLightBtn" class="btn btn-traffic" title="Зберегти файл із підсвіткою змін">🚦 Світлофор</button>

    <div class="divider"></div>

    <div class="points-box">
      <label for="pointsCountInput">Кількість точок:</label>
      <input type="number" id="pointsCountInput" min="2" max="12" value="12">
    </div>
  </header>
<!-- Панель фильтров (как в оригинальной Form1) -->
  <fieldset class="filters-panel">
    <legend>Фільтри</legend>
    <div class="filters-grid">
      <!-- Ряд 1 -->
      <div class="filter-item">
        <label for="fRoute">Маршрут</label>
        <input type="text" id="fRoute">
      </div>
      <div class="filter-item">
        <label for="fCityA">Місто виїзду</label>
        <select id="fCityA"><option value=""></option></select>
      </div>
      <div class="filter-item">
        <label for="fCityB">Місто приїзду</label>
        <select id="fCityB"><option value=""></option></select>
      </div>
      <div class="filter-item">
        <label for="fVehType">Тип ТЗ</label>
        <select id="fVehType"><option value=""></option></select>
      </div>
      <div class="filter-item">
        <label for="fDeliveryType">Тип доставки</label>
        <select id="fDeliveryType"><option value=""></option></select>
      </div>

      <!-- Ряд 2 -->
      <div class="filter-item">
        <label for="fRegion">Регіон</label>
        <select id="fRegion"><option value=""></option></select>
      </div>
      <div class="filter-item">
        <label for="fRouteGroup">Група маршрутів</label>
        <input type="text" id="fRouteGroup">
      </div>
      <div class="filter-item">
        <label for="fLoadFormat">Формат завантаження</label>
        <select id="fLoadFormat"><option value=""></option></select>
      </div>
      <div class="filter-item">
        <label for="fMovingType">Тип переміщення</label>
        <select id="fMovingType"><option value=""></option></select>
      </div>
      <div class="filter-item">
        <label for="fLogDay">Логістична доба</label>
        <select id="fLogDay">
          <option value=""></option>
          <option value="1">Понеділок</option>
          <option value="2">Вівторок</option>
          <option value="3">Середа</option>
          <option value="4">Четвер</option>
          <option value="5">П'ятниця</option>
          <option value="6">Субота</option>
          <option value="7">Неділя</option>
        </select>
      </div>

      <!-- Ряд 3 -->
      <div class="filter-item">
        <label for="fRelays">Естафети</label>
        <select id="fRelays">
          <option value=""></option>
          <option value="Так">Так</option>
          <option value="Ні">Ні</option>
        </select>
      </div>
      <div class="filter-item">
        <label for="fDeadlines">Дедлайни</label>
        <select id="fDeadlines">
          <option value=""></option>
          <option value="Так">Так</option>
          <option value="Ні">Ні</option>
        </select>
      </div>
      <div class="filter-item filter-checkbox-item">
        <label class="chk-label">
          <input type="checkbox" id="fChanged"> Лише зі змінами
        </label>
      </div>
      <div class="filter-buttons">
        <button id="applyFiltersBtn" class="btn btn-filter-apply" title="Застосувати фільтри">✔</button>
        <button id="clearFiltersBtn" class="btn btn-filter-clear" title="Очистити фільтри">✖</button>
      </div>
    </div>
  </fieldset>
  <!-- Таблица графиков -->
  <main class="grid-container">
    <table id="schedulesTable">
      <thead></thead>
      <tbody></tbody>
    </table>
  </main>

  <!-- Строка состояния с прогресс-баром -->
  <footer class="status-bar">
    <span id="sourceLabel" class="source-label">Файл не завантажено</span>
    <span id="statusInfo">Підключення...</span>
    
    <!-- Индикатор прогресса в строке состояния -->
    <div id="progressContainer" class="progress-container" style="display: none;">
      <div class="progress-bar">
        <div id="progressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <span id="progressText" class="progress-text">0%</span>
    </div>
  </footer>

  <!-- Модальное окно неизвестных узлов -->
  <div id="nodesModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Виявлено невідомі вузли</h3>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p>Наступні вузли відсутні у довіднику. Заповніть дані, щоб додати їх до бази:</p>
        <div class="table-container">
          <table id="unknownNodesTable">
            <thead>
              <tr>
                <th>Код АХ</th>
                <th>Назва православна</th>
                <th>Місто</th>
                <th>Місто (Кільце)</th>
                <th>Категорія</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveNodesBtn" class="btn btn-traffic">💾 Зберегти у довідник</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <!-- Оверлей загрузки со спиннером (крутилкой) -->
  <div id="globalLoader" class="loader-overlay" style="display: none;">
    <div class="loader-box">
      <div class="spinner"></div>
      <div id="loaderText" class="loader-text">Обробка файлу...</div>
      <div class="loader-subtext">Будь ласка, зачекайте</div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
</body>
</html>
